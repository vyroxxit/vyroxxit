<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حسابي | Vyroxx IT Services</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("vx-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#F1F4F3;--surface:#FFFFFF;--ink:#12263A;--muted:#52667A;--line:#D3DDDD;--accent:#0F8B8D;--on-accent:#FFFFFF;--hot:#D9482B;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1519;--surface:#142228;--ink:#E6EFEF;--muted:#9BB1B5;--line:#24383E;--accent:#3CC4C4;--on-accent:#0C1519;--hot:#FF7A59;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1519;--surface:#142228;--ink:#E6EFEF;--muted:#9BB1B5;--line:#24383E;--accent:#3CC4C4;--on-accent:#0C1519;--hot:#FF7A59;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;font-size:16.5px}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px}
.logo{font-weight:700;font-size:20px;text-decoration:none;direction:ltr}
.logo b{color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:0;cursor:pointer;font:inherit;font-weight:500;background:var(--accent);color:var(--on-accent);padding:10px 20px;border-radius:8px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
h1{font-size:28px;margin:10px 0}
h2{font-size:21px;margin:0 0 12px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:500;font-size:14.5px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px}
textarea{min-height:110px;resize:vertical}
.bar{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.req{border-top:1px solid var(--line);padding:14px 0}
.req:first-child{border-top:0}
.req small{color:var(--muted)}
.req p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.badge{display:inline-block;font-size:13px;padding:1px 10px;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent)}
.badge.new{border-color:var(--hot);color:var(--hot)}
.badge.done{background:var(--accent);color:var(--on-accent)}
.warn{border:1.5px solid var(--hot);border-radius:12px;padding:14px 18px;margin-bottom:18px}
.msg{color:var(--accent);min-height:24px;margin:0 0 8px}
[hidden]{display:none!important}
.theme{font:inherit;font-size:16px;line-height:1.5;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);padding:5px 11px;cursor:pointer}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
@media (max-width:560px){.wrap{padding:0 14px 60px}.logo{font-size:17px}.tools{gap:6px}.seg button,.theme{padding:5px 8px}}
.seg{height:40px}
.theme{height:40px;min-width:44px;padding:0 10px;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="index.html">VYROXX <b>IT</b></a>
    <div class="tools"><div class="seg" role="group" aria-label="Language"><button type="button" data-lang="ar">ع</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></div><button class="theme" id="theme" type="button" aria-label="Theme"></button></div>
  </header>
  <div class="actions">
    <a class="btn alt" href="index.html" style="text-decoration:none" data-i="home">الرئيسية</a>
    <button class="btn" id="auth" type="button">تسجيل الدخول بحساب Google</button>
  </div>

  <div class="warn" id="warn" data-i="warn" hidden></div>

  <main id="guest" class="card">
    <h1 data-i="g_h">حسابي</h1>
    <p class="muted" data-i="g_p1">سجّل الدخول لتحفظ معلوماتك، وتتابع حالة طلباتك، وتجمع نقاطًا تمنحك خدمة مجانية بعد كل 5 طلبات مكتملة.</p>
    <p class="muted" data-i="g_p2">نستخدم حساب Google فقط، فلا نحفظ كلمة مرور لك أبدًا.</p>
  </main>

  <main id="app" hidden>
    <h1><span data-i="hi">مرحبًا،</span> <span id="hello"></span></h1>
    <div class="grid">
      <div>
        <div class="card">
          <h2 data-i="loy_h">🎁 نقاط الولاء</h2>
          <div class="bar"><i id="barFill" style="width:0"></i></div>
          <div id="loyal" class="muted"></div>
        </div>
        <div class="card">
          <h2 data-i="me_h">معلوماتي</h2>
          <label for="name" data-i="l_name">الاسم</label><input id="name" autocomplete="name">
          <label for="phone" data-i="l_phone">رقم الهاتف / WhatsApp</label><input id="phone" dir="ltr" placeholder="+212..." autocomplete="tel">
        </div>
      </div>
      <div class="card">
        <h2 data-i="new_h">طلب جديد</h2>
        <label for="service" data-i="l_srv">نوع الخدمة</label><select id="service"></select>
        <label for="message" data-i="l_msg">وصف المشكلة</label><textarea id="message"></textarea>
        <p class="msg" id="msg" role="status"></p>
        <button class="btn" id="send" type="button" data-i="send">إرسال الطلب</button>
      </div>
    </div>
    <div class="card"><h2 data-i="mine_h">طلباتي السابقة</h2><div id="mine"><p class="muted">جارٍ التحميل…</p></div></div>

    <div class="card" id="adminBox" hidden>
      <h2><span data-i="adm_h">لوحة الإدارة</span> <span class="badge new" id="newCount"></span></h2>
      <div id="adminList"></div>
    </div>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,setDoc,getDoc,getDocs,query,where,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== عدّل هذا القسم فقط ====== */
const cfg={
  apiKey:"PASTE_API_KEY",
  authDomain:"PASTE_AUTH_DOMAIN",
  projectId:"PASTE_PROJECT_ID",
  appId:"PASTE_APP_ID"
};
const ADMIN="vyroxxvx@gmail.com";   // بريد المدير
const EVERY=5;                       // كل كم طلب مكتمل يُمنح طلب مجاني
/* ================================= */

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AR=["خدمات الحاسوب","خدمات الهواتف","خدمات الألعاب","الشبكات","الأمن السيبراني","الإنترنت العميق والمظلم","خدمات لينكس","المساعدة عن بعد","استعادة البيانات","الخدمات السحابية","التفعيل"];
const SVN={ar:AR,
en:["Computer Services","Mobile Services","Gaming Services","Networking","Cybersecurity","Deep & Dark Web","Linux Services","Remote Support","Data Recovery","Cloud Services","Software Activation"],
fr:["Services informatiques","Services mobiles","Jeux vidéo","Réseaux","Cybersécurité","Deep Web et Dark Web","Services Linux","Assistance à distance","Récupération de données","Services cloud","Activation de logiciels"]};
const LOC={ar:"ar-MA",en:"en-GB",fr:"fr-FR"};
const T={
ar:{t:"حسابي | Vyroxx IT Services",home:"الرئيسية",login:"تسجيل الدخول بحساب Google",logout:"تسجيل الخروج",warn:"لم تُضف إعدادات Firebase بعد. افتح الملف وعوّض القيم التي تبدأ بـ PASTE داخل cfg قرب نهاية الملف.",g_h:"حسابي",g_p1:"سجّل الدخول لتحفظ معلوماتك، وتتابع حالة طلباتك، وتجمع نقاطًا تمنحك خدمة مجانية بعد كل 5 طلبات مكتملة.",g_p2:"نستخدم حساب Google فقط، فلا نحفظ كلمة مرور لك أبدًا.",hi:"مرحبًا،",loy_h:"🎁 نقاط الولاء",me_h:"معلوماتي",l_name:"الاسم",l_phone:"رقم الهاتف / WhatsApp",new_h:"طلب جديد",l_srv:"نوع الخدمة",l_msg:"وصف المشكلة",send:"إرسال الطلب",mine_h:"طلباتي السابقة",adm_h:"لوحة الإدارة",loading:"جارٍ التحميل…",none:"لا توجد طلبات بعد.",trk:"رقم التتبّع:",done_n:"طلبات مكتملة:",left_a:"بقي ",left_b:" طلبات مكتملة لتحصل على خدمة مجانية.",earn_a:"🎉 حصلت سابقًا على ",earn_b:" خدمة مجانية، أخبرنا بذلك عند طلبك التالي.",e_empty:"اكتب وصف المشكلة أولًا.",sending:"جارٍ الإرسال…",sent:"✔ وصل طلبك. رقم التتبّع: ",fail:"تعذّر الإرسال، حاول مرة أخرى. ",e_login:"تعذّر تسجيل الدخول: ",e_upd:"تعذّر التحديث: ",newc:"جديد",none_adm:"لا توجد طلبات.",st:{new:"جديد",progress:"قيد المعالجة",done:"تم الحل"}},
en:{t:"My account | Vyroxx IT Services",home:"Home",login:"Sign in with Google",logout:"Sign out",warn:"Firebase settings are not added yet. Open the file and replace the values starting with PASTE inside cfg, near the end of the file.",g_h:"My account",g_p1:"Sign in to save your details, follow your requests, and earn points that give you a free service after every 5 completed requests.",g_p2:"We only use your Google account, so we never store a password for you.",hi:"Welcome,",loy_h:"🎁 Loyalty points",me_h:"My details",l_name:"Name",l_phone:"Phone / WhatsApp",new_h:"New request",l_srv:"Service type",l_msg:"Problem description",send:"Send request",mine_h:"My previous requests",adm_h:"Admin panel",loading:"Loading…",none:"No requests yet.",trk:"Tracking number:",done_n:"Completed requests:",left_a:"",left_b:" more completed requests to earn a free service.",earn_a:"🎉 You have earned ",earn_b:" free service(s). Tell us on your next request.",e_empty:"Please describe your problem first.",sending:"Sending…",sent:"✔ Your request was received. Tracking number: ",fail:"Could not send, please try again. ",e_login:"Sign-in failed: ",e_upd:"Update failed: ",newc:"new",none_adm:"No requests.",st:{new:"New",progress:"In progress",done:"Solved"}},
fr:{t:"Mon compte | Vyroxx IT Services",home:"Accueil",login:"Se connecter avec Google",logout:"Se déconnecter",warn:"Les paramètres Firebase ne sont pas encore ajoutés. Ouvrez le fichier et remplacez les valeurs commençant par PASTE dans cfg, vers la fin du fichier.",g_h:"Mon compte",g_p1:"Connectez-vous pour enregistrer vos informations, suivre vos demandes et gagner des points qui donnent un service gratuit après 5 demandes terminées.",g_p2:"Nous utilisons uniquement votre compte Google, nous ne stockons donc jamais de mot de passe.",hi:"Bienvenue,",loy_h:"🎁 Points de fidélité",me_h:"Mes informations",l_name:"Nom",l_phone:"Téléphone / WhatsApp",new_h:"Nouvelle demande",l_srv:"Type de service",l_msg:"Description du problème",send:"Envoyer la demande",mine_h:"Mes demandes précédentes",adm_h:"Panneau d’administration",loading:"Chargement…",none:"Aucune demande pour le moment.",trk:"Numéro de suivi :",done_n:"Demandes terminées :",left_a:"Encore ",left_b:" demandes terminées pour obtenir un service gratuit.",earn_a:"🎉 Vous avez gagné ",earn_b:" service(s) gratuit(s). Dites-le-nous à votre prochaine demande.",e_empty:"Décrivez d’abord votre problème.",sending:"Envoi…",sent:"✔ Demande reçue. Numéro de suivi : ",fail:"Envoi impossible, réessayez. ",e_login:"Échec de la connexion : ",e_upd:"Échec de la mise à jour : ",newc:"nouvelle(s)",none_adm:"Aucune demande.",st:{new:"Nouvelle",progress:"En cours",done:"Résolue"}}
};

const root=document.documentElement,tb=$("theme");
let lang="ar",user=null,mine=null,adm=null;
const tt=()=>T[lang];
const svName=a=>{const i=AR.indexOf(a);return i<0?a:SVN[lang][i]};
const when=r=>r.createdAt&&r.createdAt.toDate?r.createdAt.toDate().toLocaleDateString(LOC[lang]):"";
const byDate=(a,b)=>((b.createdAt&&b.createdAt.seconds)||9e9)-((a.createdAt&&a.createdAt.seconds)||9e9);

function setTheme(m){root.setAttribute("data-theme",m);tb.textContent=m==="dark"?"☀️":"🌙";try{localStorage.setItem("vx-theme",m)}catch(e){}}
tb.onclick=()=>setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark");
setTheme(root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));

function renderMine(){
  const t=tt();
  if(!mine){$("mine").innerHTML='<p class="muted">'+t.loading+'</p>';return}
  const done=mine.filter(r=>r.status==="done").length,left=EVERY-(done%EVERY),earned=Math.floor(done/EVERY);
  $("barFill").style.width=((done%EVERY)/EVERY*100)+"%";
  $("loyal").innerHTML=t.done_n+" <b>"+done+"</b><br>"+t.left_a+"<b>"+left+"</b>"+t.left_b+(earned?"<br>"+t.earn_a+"<b>"+earned+"</b>"+t.earn_b:"");
  $("mine").innerHTML=mine.length?mine.map(r=>
    '<div class="req"><b>'+esc(svName(r.service))+'</b> <span class="badge '+esc(r.status)+'">'+esc(t.st[r.status]||r.status)+'</span>'
    +'<br><small>'+t.trk+' <span dir="ltr">'+esc(r.code)+'</span> · '+esc(when(r))+'</small><p>'+esc(r.message)+'</p></div>').join("")
    :'<p class="muted">'+t.none+'</p>';
}
function renderAdmin(){
  if(!adm)return;const t=tt();
  $("newCount").textContent=adm.filter(r=>r.status==="new").length+" "+t.newc;
  $("adminList").innerHTML=adm.map(r=>
    '<div class="req"><b>'+esc(svName(r.service))+'</b> · <span dir="ltr">'+esc(r.code)+'</span> · <small>'+esc(when(r))+'</small><br>'
    +'<small>'+esc(r.name)+' · <span dir="ltr">'+esc(r.phone)+'</span> · <span dir="ltr">'+esc(r.email)+'</span></small>'
    +'<p>'+esc(r.message)+'</p>'
    +'<select data-id="'+esc(r.id)+'">'+Object.keys(t.st).map(k=>'<option value="'+k+'"'+(k===r.status?" selected":"")+'>'+t.st[k]+'</option>').join("")+'</select></div>').join("")
    ||'<p class="muted">'+t.none_adm+'</p>';
}
function setLang(l){
  lang=l;const t=T[l];
  root.lang=l;root.dir=l==="ar"?"rtl":"ltr";document.title=t.t;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=t[e.getAttribute("data-i")]});
  const sel=$("service"),i=Math.max(sel.selectedIndex,0);
  sel.innerHTML=AR.map((a,k)=>'<option value="'+a+'">'+SVN[l][k]+'</option>').join("");
  sel.selectedIndex=i;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===l)));
  $("auth").textContent=user?t.logout:t.login;
  renderMine();renderAdmin();
  try{localStorage.setItem("vx-lang",l)}catch(e){}
}
document.querySelectorAll("[data-lang]").forEach(b=>{b.onclick=()=>setLang(b.getAttribute("data-lang"))});

if(cfg.apiKey.startsWith("PASTE")){
  $("warn").hidden=false;$("auth").disabled=true;
}else{
  const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);

  $("auth").onclick=async()=>{
    if(user){await signOut(auth);return}
    const p=new GoogleAuthProvider();
    try{await signInWithPopup(auth,p)}
    catch(e){
      if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")signInWithRedirect(auth,p);
      else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")alert(tt().e_login+e.code);
    }
  };

  onAuthStateChanged(auth,async u=>{
    user=u;mine=null;adm=null;
    $("auth").textContent=u?tt().logout:tt().login;
    $("guest").hidden=!!u;$("app").hidden=!u;
    if(!u)return;
    $("hello").textContent=u.displayName||u.email;
    try{
      const s=await getDoc(doc(db,"users",u.uid));
      if(s.exists()){$("name").value=s.data().name||"";$("phone").value=s.data().phone||""}
      else $("name").value=u.displayName||"";
    }catch(e){}
    renderMine();
    await loadMine();
    const admin=u.email===ADMIN&&u.emailVerified;
    $("adminBox").hidden=!admin;
    if(admin)loadAdmin();
  });

  async function loadMine(){
    const qs=await getDocs(query(collection(db,"requests"),where("uid","==",user.uid)));
    mine=qs.docs.map(d=>({id:d.id,...d.data()})).sort(byDate);
    renderMine();
  }

  $("send").onclick=async()=>{
    const m=$("message").value.trim(),out=$("msg"),t=tt();
    if(!m){out.textContent=t.e_empty;return}
    $("send").disabled=true;out.textContent=t.sending;
    try{
      const code="VX-"+Math.random().toString(36).slice(2,8).toUpperCase();
      await addDoc(collection(db,"requests"),{uid:user.uid,email:user.email,name:$("name").value.trim(),phone:$("phone").value.trim(),
        service:$("service").value,message:m,status:"new",code:code,createdAt:serverTimestamp()});
      await setDoc(doc(db,"users",user.uid),{name:$("name").value.trim(),phone:$("phone").value.trim(),email:user.email},{merge:true});
      $("message").value="";out.textContent=t.sent+code;
      await loadMine();
    }catch(e){out.textContent=t.fail+"("+(e.code||"error")+")"}
    $("send").disabled=false;
  };

  async function loadAdmin(){
    const qs=await getDocs(collection(db,"requests"));
    adm=qs.docs.map(d=>({id:d.id,...d.data()})).sort(byDate);
    renderAdmin();
  }
  $("adminList").onchange=async e=>{
    const s=e.target;if(!s.dataset.id)return;
    try{await updateDoc(doc(db,"requests",s.dataset.id),{status:s.value});loadAdmin()}
    catch(err){alert(tt().e_upd+err.code)}
  };
}

let sl=null;try{sl=localStorage.getItem("vx-lang")}catch(e){}
const nl=(navigator.language||"ar").slice(0,2);
setLang(sl&&T[sl]?sl:(T[nl]?nl:"ar"));
</script>
</body>
</html>
